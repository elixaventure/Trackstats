# Netlify: build from the repo root.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker must never be cached, or phones keep an old app version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

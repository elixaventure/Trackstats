# Lints, tests and builds the app, then publishes it to GitHub Pages:
#   https://elixaventure.github.io/Trackstats/
# One-time setup: Settings → Pages → Source: "GitHub Actions". Until then the
# deploy job fails with GitHub's "Pages not enabled" error; build and tests still run.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Accounts and cloud sync. Set both as repository *variables* (Settings →
          # Secrets and variables → Actions → Variables). They are public values,
          # protected by Row Level Security. Leave unset for a demo-only build.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # GitHub Pages has no URL rewrites: serving the app as the 404 page makes deep links work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
